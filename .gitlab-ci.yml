image:
  name: hashicorp/terraform:latest
  entrypoint:
    - '/usr/bin/env'
    - 'PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

stages:
  - validate
  - plan
  - apply

# ----------------------------------------------------------------------
# Reusable Template for Matrix execution
# ----------------------------------------------------------------------
.tf_matrix:
  parallel:
    matrix:
      - CLOUD_DIR: ["azure", "aws"]
  before_script:
    - cd $CLOUD_DIR

# ----------------------------------------------------------------------
# Validation Stage
# ----------------------------------------------------------------------
validate:
  extends: .tf_matrix
  stage: validate
  script:
    - terraform init -backend=false
    - terraform validate

# ----------------------------------------------------------------------
# Plan Stage
# ----------------------------------------------------------------------
plan:
  extends: .tf_matrix
  stage: plan
  script:
    - terraform init
    - terraform plan -out=tfplan
  artifacts:
    # Saves the plan inside the specific folder to prevent conflicts
    paths:
      - "*/tfplan"
    expire_in: 1 hour

# ----------------------------------------------------------------------
# Apply Stage
# ----------------------------------------------------------------------
apply:
  extends: .tf_matrix
  stage: apply
  script:
    - terraform init
    - terraform apply -auto-approve tfplan
  dependencies:
    - plan
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual  # Manual gate to prevent accidental costs in two clouds