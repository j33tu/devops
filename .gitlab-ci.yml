image:
  name: hashicorp/terraform:latest
  entrypoint:
    - '/usr/bin/env'
    - 'PATH=/usr/local/sbin=/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

stages:
  - validate
  - plan
  - apply

# ----------------------------------------------------------------------
# Define the Matrix for both Cloud folders
# ----------------------------------------------------------------------
.tf_matrix:
  parallel:
    matrix:
      - CLOUD_PATH: ["terraform/azure", "terraform/aws"]

# ----------------------------------------------------------------------
# Validate Stage
# ----------------------------------------------------------------------
validate:
  extends: .tf_matrix
  stage: validate
  script:
    - terraform -chdir=$CLOUD_PATH init -backend=false
    - terraform -chdir=$CLOUD_PATH validate

# ----------------------------------------------------------------------
# Plan Stage
# ----------------------------------------------------------------------
plan:
  extends: .tf_matrix
  stage: plan
  script:
    - terraform -chdir=$CLOUD_PATH init
    - terraform -chdir=$CLOUD_PATH plan -out=tfplan
  artifacts:
    # Stores the plan for the specific cloud to pass to the apply stage
    paths:
      - "$CLOUD_PATH/tfplan"
    expire_in: 1 hour

# ----------------------------------------------------------------------
# Apply Stage
# ----------------------------------------------------------------------
apply:
  extends: .tf_matrix
  stage: apply
  script:
    - terraform -chdir=$CLOUD_PATH init
    - terraform -chdir=$CLOUD_PATH apply -auto-approve tfplan
  dependencies:
    - plan
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual # Safety gate: Allows you to trigger Azure and AWS independently