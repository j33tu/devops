image:
  name: hashicorp/terraform:latest
  entrypoint:
    - '/usr/bin/env'
    - 'PATH=/usr/local/sbin=/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'

# Ensures the pipeline runs only on the main branch
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

stages:
  - validate
  - plan
  - apply

# ----------------------------------------------------------------------
# Logic for Matrix execution across your specific subfolders
# ----------------------------------------------------------------------
.tf_matrix:
  parallel:
    matrix:
      # These must match your Git folder casing EXACTLY
      - CLOUD_PATH: ["Terraform/Azure", "Terraform/Aws"]

# ----------------------------------------------------------------------
# Validation Stage
# ----------------------------------------------------------------------
validate:
  extends: .tf_matrix
  stage: validate
  script:
    - terraform -chdir=$CLOUD_PATH init -backend=false
    - terraform -chdir=$CLOUD_PATH validate

# ----------------------------------------------------------------------
# Plan Stage
# ----------------------------------------------------------------------
plan:
  extends: .tf_matrix
  stage: plan
  script:
    - terraform -chdir=$CLOUD_PATH init
    - terraform -chdir=$CLOUD_PATH plan -out=tfplan
  artifacts:
    # Captures the plan file from the correct subfolder
    paths:
      - "$CLOUD_PATH/tfplan"
    expire_in: 1 hour

# ----------------------------------------------------------------------
# Apply Stage
# ----------------------------------------------------------------------
apply:
  extends: .tf_matrix
  stage: apply
  script:
    - terraform -chdir=$CLOUD_PATH init
    - terraform -chdir=$CLOUD_PATH apply -auto-approve tfplan
  dependencies:
    - plan
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual # Requires a manual 'Play' click in GitLab for safety