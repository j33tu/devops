image:
  name: hashicorp/terraform:latest
  entrypoint:
    - '/usr/bin/env'
    - 'PATH=/usr/local/sbin=/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'

# Pipeline runs only on the main branch
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

stages:
  - validate
  - plan
  - apply

# ----------------------------------------------------------------------
# Logic for Matrix execution with Path Filtering
# ----------------------------------------------------------------------
.tf_matrix:
  parallel:
    matrix:
      - CLOUD_PATH: ["Terraform/Azure", "Terraform/Aws"]
  rules:
    # AUTOMATIC: Only trigger jobs if changes exist in the specific folder
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - $CLOUD_PATH/**/*
      when: on_success
    # Do nothing if no changes are detected in the path
    - when: never

# ----------------------------------------------------------------------
# Validation Stage
# ----------------------------------------------------------------------
validate:
  extends: .tf_matrix
  stage: validate
  script:
    - terraform -chdir=$CLOUD_PATH init -backend=false
    - terraform -chdir=$CLOUD_PATH validate

# ----------------------------------------------------------------------
# Plan Stage
# ----------------------------------------------------------------------
plan:
  extends: .tf_matrix
  stage: plan
  script:
    - terraform -chdir=$CLOUD_PATH init
    - terraform -chdir=$CLOUD_PATH plan -out=tfplan
  artifacts:
    paths:
      - "$CLOUD_PATH/tfplan"
    expire_in: 1 hour

# ----------------------------------------------------------------------
# Apply Stage (Fully Automated)
# ----------------------------------------------------------------------
apply:
  extends: .tf_matrix
  stage: apply
  script:
    - terraform -chdir=$CLOUD_PATH init
    - terraform -chdir=$CLOUD_PATH apply -auto-approve tfplan
  dependencies:
    - plan